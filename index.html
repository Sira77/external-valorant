<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant External</title>
    <style>
        :root {
            --bg-color: #0b071a;
            --panel-bg: #130d2a;
            --sidebar-bg: #090514;
            --primary-purple: #8a2be2;
            --neon-purple: #bc13fe;
            --text-color: #e0dcf0;
            --text-muted: #7b7393;
            --success-green: #00ff88;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #241445 0%, #0b071a 100%);
        }

        /* Container หลัก */
        .wrapper {
            position: relative;
            width: 650px; /* ขยายความกว้างสำหรับแนวนอน */
            height: 420px; /* ปรับความสูงให้สมดุล */
        }

        /* สไตล์กล่อง Panel */
        .panel {
            background: var(--panel-bg);
            border: 2px solid var(--primary-purple);
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.3), inset 0 0 15px rgba(138, 43, 226, 0.1);
            position: absolute;
            width: 100%;
            height: 100%;
            transition: all 0.5s ease;
            overflow: hidden;
        }

        .hidden {
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            pointer-events: none;
        }

        /* --- หน้า LOGIN (คงโครงสร้างเดิมแต่ปรับขนาด) --- */
        #loginPage {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-title {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-purple);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: #090514;
            border: 1px solid var(--primary-purple);
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 10px rgba(188, 19, 254, 0.5);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, var(--primary-purple), var(--neon-purple));
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-submit:hover {
            box-shadow: 0 0 15px var(--neon-purple);
            transform: translateY(-2px);
        }

        .login-status {
            text-align: center;
            color: #ff4a4a;
            font-size: 14px;
            margin-top: 15px;
            min-height: 20px;
        }

        /* --- หน้า MAIN PANEL (แนวนอนแยกแถว) --- */
        .main-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* แถบเมนูด้านซ้าย */
        .sidebar {
            width: 180px;
            background: var(--sidebar-bg);
            border-right: 1px solid rgba(138, 43, 226, 0.3);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }

        .sidebar-header {
            padding: 0 20px 20px 20px;
            border-bottom: 1px solid rgba(138, 43, 226, 0.1);
            margin-bottom: 15px;
        }

        .sidebar-brand {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 8px var(--neon-purple);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 12px 20px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s;
            border-left: 3px solid transparent;
        }

        .tab-btn:hover {
            color: var(--text-color);
            background: rgba(138, 43, 226, 0.05);
        }

        .tab-btn.active {
            color: #fff;
            background: rgba(138, 43, 226, 0.15);
            border-left-color: var(--neon-purple);
            text-shadow: 0 0 5px var(--neon-purple);
        }

        /* โซนเนื้อหาเมนูตรงกลางขวา */
        .content-area {
            flex: 1;
            padding: 25px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .content-title {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
        }

        .status-badge {
            font-size: 10px;
            background: rgba(0, 255, 136, 0.1);
            color: var(--success-green);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--success-green);
            text-transform: uppercase;
        }

        /* เมนูกลุ่มฟังก์ชัน (หมวดหมู่ย่อย) */
        .tab-content {
            display: none;
            flex-direction: column;
            gap: 12px;
            height: 100%;
        }

        .tab-content.active {
            display: flex;
        }

        /* แถวตัวเลือกเมนู */
        .feature-row {
            background: rgba(9, 5, 20, 0.6);
            border: 1px solid rgba(138, 43, 226, 0.2);
            border-radius: 8px;
            padding: 14px;
        }

        .feature-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .feature-name {
            font-size: 13px;
            font-weight: 600;
        }

        /* ปุ่มสวิตช์เปิด/ปิด (Toggle Switch) */
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider-toggle {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #241b45;
            transition: .3s;
            border-radius: 20px;
            border: 1px solid var(--primary-purple);
        }

        .slider-toggle:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 3px;
            bottom: 3px;
            background-color: var(--text-muted);
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider-toggle {
            background-color: var(--primary-purple);
            border-color: var(--neon-purple);
        }

        input:checked + .slider-toggle:before {
            transform: translateX(20px);
            background-color: #fff;
            box-shadow: 0 0 8px #fff;
        }

        /* หลอดปรับเปอร์เซ็นต์ (Range Slider) */
        .range-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        .range-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: #090514;
            border-radius: 2px;
            outline: none;
        }

        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--neon-purple);
            cursor: pointer;
            box-shadow: 0 0 6px var(--neon-purple);
        }

        .range-value {
            font-size: 11px;
            color: var(--neon-purple);
            font-weight: bold;
            min-width: 30px;
            text-align: right;
        }

        /* ปุ่ม Keybind */
        .btn-keybind {
            background: #090514;
            border: 1px solid var(--primary-purple);
            color: var(--neon-purple);
            padding: 3px 8px;
            border-radius: 4px;
            min-width: 70px;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-keybind:hover {
            background: var(--primary-purple);
            color: #fff;
        }
        .btn-keybind.active {
            background: var(--neon-purple);
            color: #fff;
            border-color: #fff;
            animation: pulse 1s infinite;
        }

        /* โซนกรอกที่อยู่ */
        .inject-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }
        .inject-input-group {
            display: flex;
            gap: 8px;
        }
        .inject-input-group input {
            flex: 1;
            padding: 10px;
            background: #090514;
            border: 1px solid var(--primary-purple);
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .btn-inject {
            padding: 0 15px;
            background: linear-gradient(45deg, #4b1393, var(--primary-purple));
            border: 1px solid var(--neon-purple);
            border-radius: 6px;
            color: white;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .btn-inject:hover {
            box-shadow: 0 0 10px var(--neon-purple);
            background: linear-gradient(45deg, var(--primary-purple), var(--neon-purple));
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        
        <div id="loginPage" class="panel">
            <div class="login-title">Valorant External</div>
            <div class="input-group">
                <label>License Key</label>
                <input type="password" id="licenseKey" placeholder="ใส่รหัสผ่านตรงนี้...">
            </div>
            <button class="btn-submit" onclick="handleLogin()">Login</button>
            <div class="login-status" id="loginStatus"></div>
        </div>

        <div id="mainPanel" class="panel hidden">
            <div class="main-container">
                
                <div class="sidebar">
                    <div class="sidebar-header">
                        <div class="sidebar-brand">External Val</div>
                    </div>
                    <button class="tab-btn active" onclick="switchTab(event, 'aim')">Aim</button>
                    <button class="tab-btn" onclick="switchTab(event, 'visuals')">Visuals</button>
                    <button class="tab-btn" onclick="switchTab(event, 'antilag')">Anti Lag</button>
                    <button class="tab-btn" onclick="switchTab(event, 'inject')">Inject</button>
                </div>

                <div class="content-area">
                    <div class="content-header">
                        <div class="content-title" id="menuTitle">Aim Mode</div>
                        <div class="status-badge">Active</div>
                    </div>

                    <div id="aim" class="tab-content active">
                        <div class="feature-row">
                            <div class="feature-info">
                                <div class="feature-name">Aiming Assist</div>
                                <label class="switch">
                                    <input type="checkbox">
                                    <span class="slider-toggle"></span>
                                </label>
                            </div>
                            <div class="range-container">
                                <input type="range" class="range-slider" min="0" max="100" value="0" oninput="updateValue(this)">
                                <span class="range-value">0%</span>
                            </div>
                        </div>

                        <div class="feature-row">
                            <div class="feature-info">
                                <div class="feature-name">Aim Assist Keybind</div>
                                <div class="btn-keybind" onclick="startKeybindListen(this)">[ NONE ]</div>
                            </div>
                        </div>

                        <div class="feature-row">
                            <div class="feature-info">
                                <div class="feature-name">Reduce Recoil</div>
                                <label class="switch">
                                    <input type="checkbox">
                                    <span class="slider-toggle"></span>
                                </label>
                            </div>
                            <div class="range-container">
                                <input type="range" class="range-slider" min="0" max="100" value="0" oninput="updateValue(this)">
                                <span class="range-value">0%</span>
                            </div>
                        </div>
                    </div>

                    <div id="visuals" class="tab-content">
                        <div class="feature-row">
                            <div class="feature-info">
                                <div class="feature-name">Expand Hitbox</div>
                                <label class="switch">
                                    <input type="checkbox">
                                    <span class="slider-toggle"></span>
                                </label>
                            </div>
                            <div class="range-container">
                                <input type="range" class="range-slider" min="0" max="100" value="0" oninput="updateValue(this)">
                                <span class="range-value">0%</span>
                            </div>
                        </div>

                        <div class="feature-row">
                            <div class="feature-info">
                                <div class="feature-name">Enemies on Map</div>
                                <label class="switch">
                                    <input type="checkbox">
                                    <span class="slider-toggle"></span>
                                </label>
                            </div>
                            <div class="range-container">
                                <input type="range" class="range-slider" min="0" max="100" value="0" oninput="updateValue(this)">
                                <span class="range-value">0%</span>
                            </div>
                        </div>
                    </div>

                    <div id="antilag" class="tab-content">
                        <div class="feature-row">
                            <div class="feature-info">
                                <div class="feature-name">Anti Lag System</div>
                                <label class="switch">
                                    <input type="checkbox">
                                    <span class="slider-toggle"></span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div id="inject" class="tab-content">
                        <div class="inject-container">
                            <div class="input-group" style="margin-bottom: 0;">
                                <label style="font-size: 11px;">Valorant Installation Directory Path</label>
                            </div>
                            <div class="inject-input-group">
                                <input type="text" id="dirPath" placeholder="C:\Riot Games\VALORANT\live...">
                                <button class="btn-inject" onclick="mockConnect()">Connect</button>
                            </div>
                            <div id="injectStatus" style="font-size: 11px; margin-top: 5px; color: var(--text-muted);"></div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        // ฟังก์ชันสลับแท็บเมนู
        function switchTab(evt, tabName) {
            const tabcontents = document.getElementsByClassName("tab-content");
            for (let i = 0; i < tabcontents.length; i++) {
                tabcontents[i].classList.remove("active");
            }

            const tablinks = document.getElementsByClassName("tab-btn");
            for (let i = 0; i < tablinks.length; i++) {
                tablinks[i].classList.remove("active");
            }

            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
            
            // เปลี่ยนหัวข้อเมนูตามแท็บ
            document.getElementById("menuTitle").innerText = tabName + " Mode";
        }

        // ฟังก์ชันอัปเดตตัวเลขเปอร์เซ็นต์ของ Slider
        function updateValue(slider) {
            const valueSpan = slider.nextElementSibling;
            valueSpan.innerText = slider.value + '%';
        }

        // ฟังก์ชันตรวจเช็ครหัสผ่านตอน Login
        function handleLogin() {
            const keyInput = document.getElementById('licenseKey').value;
            const statusDiv = document.getElementById('loginStatus');
            const loginPage = document.getElementById('loginPage');
            const mainPanel = document.getElementById('mainPanel');

            if (keyInput === 've-d5kety' || keyInput.toLowerCase() === 've-d5kety') {
                statusDiv.style.color = '#00ff88';
                statusDiv.innerText = 'Login Success! Loading...';
                
                setTimeout(() => {
                    loginPage.classList.add('hidden');
                    mainPanel.classList.remove('hidden');
                }, 1000);
            } else {
                statusDiv.style.color = '#ff4a4a';
                statusDiv.innerText = 'Invalid License Key! Try again.';
            }
        }

        // ฟังก์ชันระบบ Keybind จำลอง
        let isListening = false;
        function startKeybindListen(button) {
            if (isListening) return;
            isListening = true;
            button.classList.add('active');
            button.innerText = 'Press Key...';

            const keyListener = (event) => {
                event.preventDefault();
                button.innerText = `[ ${event.key.toUpperCase()} ]`;
                button.classList.remove('active');
                isListening = false;
                window.removeEventListener('keydown', keyListener);
            };

            window.addEventListener('keydown', keyListener);
        }

        // ฟังก์ชันกดปุ่ม Connect จำลอง
        function mockConnect() {
            const pathValue = document.getElementById('dirPath').value;
            const statusText = document.getElementById('injectStatus');
            
            if (!pathValue.trim()) {
                statusText.style.color = '#ff4a4a';
                statusText.innerText = 'Please enter a valid directory path.';
                return;
            }

            statusText.style.color = '#bc13fe';
            statusText.innerText = 'Analyzing directory structure...';

            setTimeout(() => {
                statusText.style.color = '#00ff88';
                statusText.innerText = 'Configuration synced successfully.';
            }, 1500);
        }
    </script>
</body>
</html>
